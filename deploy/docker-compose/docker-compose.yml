version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai_office}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_office_pass}
      POSTGRES_DB: ${DB_NAME:-ai_office}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_office} -d ${DB_NAME:-ai_office}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ao-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.api
    container_name: ao-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      AO_CONFIG_PATH: /app/config/config.yaml
      AO_SERVER_HOST: ${API_HOST:-0.0.0.0}
      AO_SERVER_PORT: ${API_PORT:-8080}
      AO_SERVER_MODE: ${API_MODE:-release}
      AO_DATABASE_HOST: postgres
      AO_DATABASE_PORT: 5432
      AO_DATABASE_USER: ${DB_USER:-ai_office}
      AO_DATABASE_PASSWORD: ${DB_PASSWORD:-ai_office_pass}
      AO_DATABASE_DBNAME: ${DB_NAME:-ai_office}
      AO_DATABASE_SSLMODE: disable
      AO_REDIS_HOST: redis
      AO_REDIS_PORT: 6379
      AO_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AO_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs

  nginx:
    image: nginx:1.25-alpine
    container_name: ao-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_logs:
