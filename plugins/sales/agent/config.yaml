# Sales Department Subagent 配置

name: sales
display_name: 销售助手
description: 处理销售相关任务，包括客户管理、报价、合同跟踪等
agent_type: department
plugin_id: sales
version: "1.0.0"

models:
  primary:
    provider: "anthropic"
    model_id: "claude-sonnet-4-20250514"
    temperature: 0.7
    max_tokens: 8192

tools:
  - name: sales_query
    display_name: 客户查询
    description: 查询客户、报价、合同信息
    allowed_roles:
      - staff
      - specialist
      - manager
      - executive

  - name: sales_mutate
    display_name: 销售操作
    description: 创建/更新客户、报价、合同
    allowed_roles:
      - specialist
      - manager
      - executive

  - name: sales_analytics
    display_name: 销售分析
    description: 销售漏斗、转化率、业绩统计
    allowed_roles:
      - manager
      - executive

trigger:
  mode: auto
  keywords:
    - "客户"
    - "报价"
    - "合同"
    - "销售"
    - "业绩"
    - "漏斗"
  priority: 8

permissions:
  data_scope:
    staff: personal
    specialist: department
    manager: all
    executive: executive
  sensitive_fields:
    - contract_amount
    - discount_rate
    - commission

limits:
  max_steps: 25
  max_concurrent: 2
  timeout_seconds: 300
