# Service (After-Sales) Department Subagent 配置

name: service
display_name: 售后助手
description: 处理售后相关任务，包括工单管理、客户反馈、服务人员调度等
agent_type: department
plugin_id: service
version: "1.0.0"

models:
  primary:
    provider: "anthropic"
    model_id: "claude-sonnet-4-20250514"
    temperature: 0.7
    max_tokens: 8192

tools:
  - name: service_query
    display_name: 工单查询
    description: 查询售后工单和服务人员
    allowed_roles:
      - staff
      - specialist
      - manager
      - executive

  - name: service_mutate
    display_name: 工单操作
    description: 创建/更新/分配工单
    allowed_roles:
      - specialist
      - manager
      - executive

  - name: service_analytics
    display_name: 售后分析
    description: 工单完成率、满意度统计
    allowed_roles:
      - manager
      - executive

trigger:
  mode: auto
  keywords:
    - "售后"
    - "工单"
    - "反馈"
    - "维修"
    - "退换"
    - "投诉"
  priority: 7

permissions:
  data_scope:
    staff: personal
    specialist: department
    manager: all
    executive: executive

limits:
  max_steps: 20
  max_concurrent: 3
  timeout_seconds: 300
