# Tender Department Subagent 配置

name: tender
display_name: 招投标助手
description: 处理招投标相关任务，包括标书制定、投标管理、资质审查等
agent_type: department
plugin_id: tender
version: "1.0.0"

models:
  primary:
    provider: "anthropic"
    model_id: "claude-sonnet-4-20250514"
    temperature: 0.7
    max_tokens: 8192

tools:
  - name: tender_query
    display_name: 标书查询
    description: 查询标书和投标记录
    allowed_roles:
      - specialist
      - manager
      - executive

  - name: tender_mutate
    display_name: 标书操作
    description: 创建/更新标书、提交投标
    allowed_roles:
      - specialist
      - manager
      - executive

  - name: tender_analytics
    display_name: 投标分析
    description: 中标率、投标趋势分析
    allowed_roles:
      - manager
      - executive

trigger:
  mode: auto
  keywords:
    - "招标"
    - "投标"
    - "标书"
    - "资质"
    - "中标"
  priority: 6

permissions:
  data_scope:
    specialist: department
    manager: all
    executive: executive
  sensitive_fields:
    - bid_price
    - competitor_info

limits:
  max_steps: 25
  max_concurrent: 2
  timeout_seconds: 300