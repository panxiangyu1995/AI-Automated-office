version: 2

project_name: ai-automated-office

before:
  hooks:
    - go mod tidy -C api
    - go mod tidy -C cli
    - "sh -c 'mkdir -p .build/skills && PYTHONPATH=.opencode/skills/skill-creator python3 .opencode/skills/skill-creator/scripts/package_skill.py .opencode/skills/ai-office-api .build/skills/'"

builds:
  - id: api
    dir: ./api
    main: ./cmd/server/main.go
    binary: ao-api
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  - id: cli
    dir: ./cli
    main: ./main.go
    binary: ao-cli
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  - id: installer
    dir: ./cli/installer
    main: ./main.go
    binary: ao-setup
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: cli-archive
    ids:
      - cli
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}-cli_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

  - id: api-archive
    ids:
      - api
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}-api_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

  - id: installer-archive
    ids:
      - installer
    format: zip
    name_template: >-
      {{ .ProjectName }}-setup_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: .build/skills/*.skill
        strip_parent: true
      - src: dist/cli_{{ .Os }}_{{ .Arch }}*/ao-cli*
        strip_parent: true

checksum:
  name_template: checksums.txt

dockers:
  - id: api-amd64
    ids:
      - api
    use: docker
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Agent-driven enterprise SaaS API
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.revision={{ .Commit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0-or-later
    dockerfile: deploy/docker-compose/Dockerfile.api
    extra_files:
      - api/config/config.yaml
    image_templates:
      - "ghcr.io/panxiangyu1995/ao-api:{{ .Version }}-amd64"
      - "ghcr.io/panxiangyu1995/ao-api:latest-amd64"

  - id: cli-amd64
    ids:
      - cli
    use: docker
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --label=org.opencontainers.image.title=ao-cli
      - --label=org.opencontainers.image.description=CLI tool for AI-Automated-office
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.revision={{ .Commit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0-or-later
    dockerfile: deploy/docker-compose/Dockerfile.cli
    image_templates:
      - "ghcr.io/panxiangyu1995/ao-cli:{{ .Version }}-amd64"
      - "ghcr.io/panxiangyu1995/ao-cli:latest-amd64"

docker_manifests:
  - name_template: "ghcr.io/panxiangyu1995/ao-api:{{ .Version }}"
    image_templates:
      - "ghcr.io/panxiangyu1995/ao-api:{{ .Version }}-amd64"
  - name_template: "ghcr.io/panxiangyu1995/ao-api:latest"
    image_templates:
      - "ghcr.io/panxiangyu1995/ao-api:latest-amd64"
  - name_template: "ghcr.io/panxiangyu1995/ao-cli:{{ .Version }}"
    image_templates:
      - "ghcr.io/panxiangyu1995/ao-cli:{{ .Version }}-amd64"
  - name_template: "ghcr.io/panxiangyu1995/ao-cli:latest"
    image_templates:
      - "ghcr.io/panxiangyu1995/ao-cli:latest-amd64"

brews:
  - name: ao-cli
    ids:
      - cli-archive
    repository:
      owner: panxiangyu1995
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/panxiangyu1995/AI-Automated-office"
    description: "CLI tool for AI-Automated-office — Agent-driven enterprise SaaS"
    license: "AGPL-3.0-or-later"
    install: |
      bin.install "ao-cli"
    test: |
      system "#{bin}/ao-cli", "--version"

scoops:
  - name: ao-cli
    ids:
      - cli-archive
    repository:
      owner: panxiangyu1995
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/panxiangyu1995/AI-Automated-office"
    description: "CLI tool for AI-Automated-office — Agent-driven enterprise SaaS"
    license: "AGPL-3.0-or-later"

nfpms:
  - id: cli-packages
    ids:
      - cli
    package_name: ao-cli
    vendor: AI-Automated-office
    homepage: "https://github.com/panxiangyu1995/AI-Automated-office"
    maintainer: "AI-Automated-office <info@ai-office.com>"
    description: "CLI tool for AI-Automated-office — Agent-driven enterprise SaaS"
    license: "AGPL-3.0-or-later"
    formats:
      - deb
      - rpm
      - apk

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  extra_files:
    - glob: ./cli/npm/*
    - glob: ./.build/skills/*.skill

