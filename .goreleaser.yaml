version: 2

project_name: ai-automated-office

before:
  hooks:
    - go mod tidy -C api
    - go mod tidy -C cli

builds:
  - id: api
    dir: ./api
    main: ./cmd/server/main.go
    binary: ao-api
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  - id: cli
    dir: ./cli
    main: ./main.go
    binary: ao-cli
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

  - id: installer
    dir: ./cli/installer
    main: ./main.go
    binary: ao-setup
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    hooks:
      post: |
        mkdir -p dist/installer/{{ .Os }}_{{ .Arch }}
        cp dist/{{ .Os }}_{{ .Arch }}/ao-setup dist/installer/{{ .Os }}_{{ .Arch }}/

archives:
  - id: cli-archive
    ids:
      - cli
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}-cli_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

  - id: api-archive
    ids:
      - api
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}-api_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

  - id: installer-archive
    ids:
      - installer
    format: zip
    name_template: >-
      {{ .ProjectName }}-setup_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - dist/skills/*.skill

checksum:
  name_template: checksums.txt



brews:
  - name: ao-cli
    ids:
      - cli-archive
    repository:
      owner: panxiangyu1995
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/panxiangyu1995/AI-Automated-office"
    description: "CLI tool for AI-Automated-office — Agent-driven enterprise SaaS"
    license: "AGPL-3.0-or-later"
    install: |
      bin.install "ao-cli"
    test: |
      system "#{bin}/ao-cli", "--version"

scoops:
  - name: ao-cli
    ids:
      - cli-archive
    repository:
      owner: panxiangyu1995
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/panxiangyu1995/AI-Automated-office"
    description: "CLI tool for AI-Automated-office — Agent-driven enterprise SaaS"
    license: "AGPL-3.0-or-later"

nfpms:
  - id: cli-packages
    ids:
      - cli
    package_name: ao-cli
    vendor: AI-Automated-office
    homepage: "https://github.com/panxiangyu1995/AI-Automated-office"
    maintainer: "AI-Automated-office <info@ai-office.com>"
    description: "CLI tool for AI-Automated-office — Agent-driven enterprise SaaS"
    license: "AGPL-3.0-or-later"
    formats:
      - deb
      - rpm
      - apk

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  extra_files:
    - glob: ./cli/npm/*
    - glob: ./dist/skills/*.skill

