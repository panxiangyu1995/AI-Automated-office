version: "3.8"

services:
  # PostgreSQL 数据库 - E2E 测试专用
  postgres:
    image: postgres:15-alpine
    container_name: ai-office-test-postgres
    environment:
      POSTGRES_DB: ai_office_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54320:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/test/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai-office-test-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-office-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - ai-office-test-network

  # Go 后端服务
  api:
    build:
      context: ./cloud-server
      dockerfile: Dockerfile
    container_name: ai-office-test-api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_PASSWORD=postgres
      - DB_NAME=ai_office_test
      - DB_USER=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
      - MODE=development
      - JWT_SECRET=test-secret-key-for-e2e-testing-only
      - BYPASS_AUTH=false
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
      - LOG_OUTPUT=stdout
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ai-office-test-network

  # 前端 Vite 开发服务器
  frontend:
    image: node:20-alpine
    container_name: ai-office-test-frontend
    working_dir: /app
    command: >
      sh -c "npm install pnpm -g &&
             npm install --frozen-lockfile &&
             npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080
      - NODE_ENV=development
    ports:
      - "1420:1420"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/dist
      - /app/.turbo
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1420 || curl -f http://localhost:1420 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-office-test-network

volumes:
  postgres_test_data:

networks:
  ai-office-test-network:
    driver: bridge
