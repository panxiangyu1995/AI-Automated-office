[package]
name = "ai-automated-office"
version = "0.1.0"
description = "AI-Automated-office - AI赋能的企业ERP系统"
authors = ["PAN"]
edition = "2021"

[lib]
name = "ai_automated_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-websocket = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
futures = "0.3"
rusqlite = { version = "0.29", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1"
toml = "0.8"
zerocopy = "0.7"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
once_cell = "1"
bcrypt = "0.19.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
chrono = { version = "0.4.44", features = ["serde"] }
# Crypto dependencies for local session cache
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
machine-uid = "0.5"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
semver = "1"
serde_yaml = "0.9"
glob = "0.3"
md5 = "0.7"
lru = "0.12"
zip = "2.2"
regex = "1"
urlencoding = "2"
dirs = "5"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
# 用于单元测试
tokio-test = "0.4"

[[example]]
name = "verify_db"
path = "examples/verify_db.rs"
