server:
  port: 3000
  mode: debug
  read_timeout: 30s
  write_timeout: 30s
  bypass_auth: true

database:
  driver: postgres
  host: localhost
  port: 5432
  name: ai_office
  user: postgres
  password: postgres
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h

log:
  level: info
  format: json
  output: stdout
  file_path: logs/app.log

jwt:
  secret: dev-secret-key-for-testing-only
  expire: 24h
  issuer: ai-office

cors:
  allowed_origins:
    - "http://localhost:1420"
    - "http://127.0.0.1:1420"
    - "tauri://localhost"
    - "https://tauri.localhost"
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
  exposed_headers:
    - Content-Length
    - Content-Type
