# Proposal: 意图路由引擎

## 变更类型

- [x] 新功能
- [ ] 重构
- [ ] 优化
- [ ] 开发

## 背景

主 Agent 需要根据用户意图智能路由到合适的 Subagent。这需要实现意图分类引擎和路由决策逻辑。

## 目标

实现意图路由引擎：

1. **意图分类**：关键词匹配 + 语义分类
2. **路由决策**：根据意图选择目标 Subagent
3. **委派执行**：构建 DelegationContract 并执行

## 范围

### 包含

- 意图分类器
- 路由决策器
- 委派执行器

### 不包含

- 具体 Subagent 实现
- 权限检查（由 Permission Matrix 处理）

## 影响范围

### 前端

- `src/features/agent/router/` - 路由相关组件

### 后端

- `src-tauri/src/agent/router/` - 路由模块

## 风险评估

| 风险 | 可能性 | 影响 | 缓解措施 |
|------|--------|------|----------|
| 意图识别不准 | 中 | 中 | 提供 fallback 到主 Agent |
| 路由循环 | 低 | 高 | 深度限制检查 |

## 依赖

- **前置依赖**: Story 60.1、60.2、60.3
- **后置依赖**: Story 60.5（Personal Subagent CRUD）
