# Proposal: Personal Subagent CRUD

## 变更类型

- [x] 新功能
- [ ] 重构
- [ ] 优化
- [ ] 开发

## 背景

用户需要创建个人专用的 Subagent 来处理特殊场景。这些 Subagent 存储在本地，仅供用户本人使用。

## 目标

实现 Personal Subagent CRUD：

1. **创建**：用户自定义名称、提示词、工具、触发条件
2. **读取**：列表、详情、搜索
3. **更新**：修改配置、版本历史
4. **删除**：确认删除、清理关联数据

## 范围

### 包含

- CRUD API
- 版本历史
- 导入导出

### 不包含

- AI 辅助生成提示词（后续迭代）
- 模板市场（后续迭代）

## 影响范围

### 前端

- `src/features/settings/components/PersonalAgentManager.tsx`

### 后端

- `src-tauri/src/commands/personal_subagent.rs`

## 风险评估

| 风险 | 可能性 | 影响 | 缓解措施 |
|------|--------|------|----------|
| 数据隔离 | 高 | 高 | 严格 creator_id 检查 |
| 权限逃逸 | 中 | 高 | 工具权限上限裁剪 |

## 依赖

- **前置依赖**: Story 60.1（Subagent 框架）
- **后置依赖**: 无
