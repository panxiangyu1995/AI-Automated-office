# Proposal: 模型分层与自动路由

## 变更类型

- [x] 新功能
- [ ] 重构
- [ ] 优化
- [ ] 开发

## 背景

根据 ADR-059 设计，不同任务应使用不同规模的模型：主模型用于复杂推理，轻量模型用于 OCR 等简单任务，小模型用于标题生成等无工具任务。

## 目标

实现模型分层与自动路由：

1. **模型选择器**：根据任务类型选择合适模型
2. **复杂度评估**：判断任务复杂度
3. **自动切换**：在执行过程中动态切换模型

## 范围

### 包含

- 模型路由器
- 复杂度评估器
- 动态切换逻辑

### 不包含

- 模型提供商实现（假设已存在）
- 成本统计

## 影响范围

### 前端

- `src/features/agent/model/` - 模型选择组件

### 后端

- `src-tauri/src/agent/model_router/` - 模型路由模块

## 风险评估

| 风险 | 可能性 | 影响 | 缓解措施 |
|------|--------|------|----------|
| 模型切换延迟 | 中 | 低 | 预热机制 |
| 复杂度误判 | 中 | 中 | 降级到主模型 |

## 依赖

- **前置依赖**: Story 60.1、60.4
- **后置依赖**: 无
