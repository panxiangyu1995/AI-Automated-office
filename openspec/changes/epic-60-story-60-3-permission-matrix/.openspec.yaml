# Proposal: 权限矩阵基础

## 变更类型

- [x] 新功能
- [ ] 重构
- [ ] 优化
- [ ] 开发

## 背景

根据 ADR-059 设计，需要实现角色×部门×能力三维权限矩阵，控制用户对 Subagent 工具的访问。

## 目标

实现权限矩阵基础：

1. **三层权限域**：Platform Base、Department Capability、Role Enhancement
2. **字段级权限**：控制返回数据的可见字段
3. **数据范围限制**：personal、department、all、executive

## 范围

### 包含

- 权限计算引擎
- 字段权限检查器
- 数据范围过滤

### 不包含

- UI 配置界面（Story 60.6）
- 动态权限变更

## 影响范围

### 前端

- `src/features/agent/` - 权限相关组件

### 后端

- `src-tauri/src/agent/permission/` - 权限模块

## 风险评估

| 风险 | 可能性 | 影响 | 缓解措施 |
|------|--------|------|----------|
| 权限配置复杂 | 高 | 中 | 提供默认配置 |
| 性能影响 | 中 | 中 | 缓存权限结果 |

## 依赖

- **前置依赖**: Story 60.1（Subagent 框架）
- **后置依赖**: Story 60.2（Finance Subagent）
