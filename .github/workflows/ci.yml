name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            api/go.sum
            cli/go.sum

      - name: API - go vet
        working-directory: api
        run: go vet ./...

      - name: CLI - go vet
        working-directory: cli
        run: go vet ./...

      - name: API - go fmt check
        working-directory: api
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: CLI - go fmt check
        working-directory: cli
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ai_office
          POSTGRES_PASSWORD: ai_office_pass
          POSTGRES_DB: ai_office_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            api/go.sum
            cli/go.sum

      - name: API - Unit Tests
        working-directory: api
        env:
          AO_DATABASE_HOST: localhost
          AO_DATABASE_PORT: 5432
          AO_DATABASE_USER: ai_office
          AO_DATABASE_PASSWORD: ai_office_pass
          AO_DATABASE_DBNAME: ai_office_test
          AO_DATABASE_SSLMODE: disable
          AO_REDIS_HOST: localhost
          AO_REDIS_PORT: 6379
          AO_JWT_SECRET: test-secret-key
        run: go test -race -coverprofile=coverage.out ./...

      - name: CLI - Unit Tests
        working-directory: cli
        run: go test -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            api/go.sum
            cli/go.sum

      - name: Build API
        working-directory: api
        run: go build -o /dev/null ./cmd/server/main.go

      - name: Build CLI
        working-directory: cli
        run: go build -o /dev/null ./main.go
