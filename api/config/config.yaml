server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"
  cors_origins:
    - "*"
  read_timeout: 30
  write_timeout: 30
  shutdown_timeout: 15

database:
  host: "localhost"
  port: 5432
  user: "ai_office"
  password: "ai_office_pass"
  dbname: "ai_office"
  sslmode: "disable"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "change-me-in-production"
  access_token_ttl: 3600
  refresh_token_ttl: 2592000
  issuer: "ai-office"

log:
  level: "info"
  filename: "logs/app.log"
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true
